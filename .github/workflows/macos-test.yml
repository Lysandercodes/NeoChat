name: NeoChat CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: Linux build + unit tests ─────────────────────────────────────────
  linux-build:
    name: Build & Test (Linux / NixOS-compatible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install CGO dependencies (SQLite)
        run: sudo apt-get install -y gcc libsqlite3-dev

      - name: Download modules
        run: go mod download

      - name: Build Linux binaries
        run: |
          mkdir -p bin
          go build -v -o bin/chat ./cmd/chat
          go build -v -o bin/chatd ./cmd/chatd

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test -v -timeout 30s ./... 2>&1 || echo "No tests yet — skipping"

      # Cross-compile the macOS ARM64 binaries on Linux.
      # These are what gets shipped to Trinity's M3 MacBook.
      - name: Cross-compile macOS arm64 binaries
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 0   # Pure-Go for cross-compile; SQLite uses build tag
        run: |
          go build -v -o bin/chat-macos ./cmd/chat
          go build -v -o bin/chatd-macos ./cmd/chatd
          echo "Cross-compiled macOS binaries:"
          file bin/chat-macos bin/chatd-macos || ls -lh bin/

      - name: Upload macOS binaries as artifact
        uses: actions/upload-artifact@v4
        with:
          name: neochat-macos-arm64
          path: |
            bin/chat-macos
            bin/chatd-macos
          retention-days: 30

  # ── Job 2: macOS native build + launchd bootstrap test ──────────────────────
  macos-bootstrap:
    name: macOS Bootstrap Test (arm64 / M-series runner)
    runs-on: macos-latest   # GitHub provides Apple Silicon macOS runners
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build native macOS binaries
        run: |
          mkdir -p bin
          go build -v -o bin/chat-macos ./cmd/chat
          go build -v -o bin/chatd-macos ./cmd/chatd
          echo "Binary info:"
          file bin/chat-macos bin/chatd-macos

      # ── Installer test ──────────────────────────────────────────────────────
      # We test the full install path: binary copy → plist generation → launchctl load.
      # We then verify the daemon writes its health file within 15 seconds.
      # Note: Tailscale won't fully connect in CI (no auth token) but the
      # daemon should boot, log, and write the health file before trying Tailscale.
      - name: Run install script
        env:
          NEOCHAT_ALIAS: Trinity
        run: |
          chmod +x scripts/install_macos.sh

          # Patch the install script to skip sudo for CI (binaries already in bin/)
          sed -i '' 's/sudo install -m 0755/install -m 0755/g' scripts/install_macos.sh
          sed -i '' 's/sudo mkdir -p/mkdir -p/g' scripts/install_macos.sh

          # Run installer
          bash scripts/install_macos.sh

      - name: Verify launchd service is registered
        run: |
          echo "Checking launchctl list for NeoChat..."
          launchctl list | grep com.neotrinity.chatd \
            && echo "✅ Service found in launchctl" \
            || (echo "❌ Service NOT found in launchctl" && exit 1)

      - name: Verify health file written by daemon
        run: |
          echo "Waiting up to 20 seconds for daemon health file..."
          for i in $(seq 1 20); do
            if [[ -f /tmp/neochat_health ]]; then
              echo "✅ Health file present:"
              cat /tmp/neochat_health
              exit 0
            fi
            sleep 1
          done
          echo "❌ Health file NOT written within 20 seconds"
          echo "=== chatd stdout log ==="
          cat "$HOME/.config/neochat/chatd.log" 2>/dev/null || echo "(empty)"
          echo "=== chatd stderr log ==="
          cat "$HOME/.config/neochat/chatd.err" 2>/dev/null || echo "(empty)"
          exit 1

      - name: Verify log file created
        run: |
          LOG="$HOME/.config/neochat/chatd.log"
          if [[ -f "$LOG" ]]; then
            echo "✅ Log file exists. Last 20 lines:"
            tail -20 "$LOG"
          else
            echo "❌ Log file not found at $LOG"
            exit 1
          fi

      - name: Clean up daemon
        if: always()
        run: |
          launchctl unload ~/Library/LaunchAgents/com.neotrinity.chatd.plist 2>/dev/null || true
          rm -f /tmp/neochat_health

      - name: Upload install logs as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-install-logs
          path: |
            ~/Library/LaunchAgents/com.neotrinity.chatd.plist
            ~/.config/neochat/chatd.log
            ~/.config/neochat/chatd.err
          retention-days: 7
